[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-anim-generator"
version = "0.6.2"
description = "AI emotion-driven animation generator for Windows desktops."
readme = "CONTRIBUTING.md"
requires-python = ">=3.10"
authors = [{ name = "tater-labs" }]
dependencies = [
    "numpy>=1.26,<3",
    "pydantic>=2.6",
    "rich>=13.7",
    "Pillow>=10.2",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.9"]

[project.scripts]
emotion-anim = "emotion_anim.app:main"

[tool.setuptools.packages.find]
include = ["emotion_anim*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
strict = true
files = ["emotion_anim/core", "emotion_anim/services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"